[project]
name = "resume-interview-exam"
version = "0.1.0"
description = "Local interview exam system based on a resume and target role"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "ddgs>=9.0,<10",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markitdown[pdf]>=0.1,<1",
  "openai>=1.60,<2",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
